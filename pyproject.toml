[project]
name = "sql-agent-eval"
version = "0.1.0"
description = "A tool-using text-to-SQL agent written on the raw Claude API, with an evaluation harness and ablations on BIRD Mini-Dev."
readme = "README.md"
authors = [{ name = "Jihaan Sakariya" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "sqlglot>=30.23.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.281"]

[project.scripts]
sqlagent = "sql_agent_eval.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
